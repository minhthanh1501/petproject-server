services:
  db:
    image: postgres:18-alpine
    container_name: postgres_18_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: petproject
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata_18:/var/lib/postgresql

volumes:
  pgdata_18: